[workspace]
members = [
    ".",
    "crates/bmc-attestation",
    "crates/backend-client",
    "crates/bmc-dispatch",
    "crates/bmc-error",
    "crates/bmc-inventory",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
bmc-attestation = { path = "crates/bmc-attestation" }
backend-client = { path = "crates/backend-client" }
bmc-dispatch = { path = "crates/bmc-dispatch" }
bmc-error = { path = "crates/bmc-error" }
bmc-inventory = { path = "crates/bmc-inventory" }
futures = "0.3"
http = "1"
mac_address = "1.2.1"
nv-redfish = { version = "0.22.0", features = [
    "bmc-http",
    "oem-nvidia",
    "chassis",
    "computer-systems",
    "fabrics",
    "managers",
    "processors",
    "memory",
    "storages",
    "power-supplies",
    "power",
    "secure-boot",
    "pcie-devices",
    "update-service",
] }
nv-redfish-bmc-mock = "0.22.0"
nv-redfish-dispatcher = "0.22.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full", "tracing"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", default-features = false, features = ["v5"] }

[package]
name = "fleet-intelligence-oob"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bmc-collector"
path = "src/main.rs"

[dependencies]
backend-client.workspace = true
reqwest.workspace = true
clap.workspace = true
bmc-attestation.workspace = true
bmc-dispatch.workspace = true
bmc-inventory.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
