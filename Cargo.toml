[workspace]
members = [
    ".",
    "crates/bmc-attestation",
    "crates/bmc-inventory",
    "crates/bmc-telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
bmc-inventory = { path = "crates/bmc-inventory" }
futures = "0.3"
nv-redfish = { version = "0.10.1", features = ["bmc-http", "std-redfish"] }
nv-redfish-bmc-mock = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", default-features = false, features = ["v5"] }

[package]
name = "fleet-intelligence-oob"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bmc-collector"
path = "src/main.rs"

[dependencies]
clap.workspace = true
bmc-inventory.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
