[package]
name = "fleet-intelligence-oob"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "bmc-collector"
path = "src/main.rs"

[dependencies]
bmc-explorer = { git = "https://github.com/NVIDIA/infra-controller.git", tag = "v0.9.0" }
clap = { version = "4", features = ["derive", "env"] }
mac_address = "1.1"
model = { package = "carbide-api-model", git = "https://github.com/NVIDIA/infra-controller.git", tag = "v0.9.0" }
nv-redfish = { version = "0.8.1", features = ["bmc-http"] }
tokio = { version = "1", features = ["full", "tracing"] }
tracing-subscriber = "0.3"
url = "2"
