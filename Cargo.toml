[package]
name = "fleet-intelligence-oob"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "bmc-collector"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
mac_address = "1.1"
nv-redfish = { version = "0.10.1", features = ["bmc-http", "std-redfish"] }
tokio = { version = "1", features = ["full", "tracing"] }
tracing-subscriber = "0.3"
url = "2"
