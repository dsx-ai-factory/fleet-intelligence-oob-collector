apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.fullname" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet-intelligence-oob-collector.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ include "fleet-intelligence-oob-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.bmcCollector.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - run
            - --config
            - /etc/fleet-intelligence/{{ .Values.config.secretKey }}
            - --interval-seconds
            - {{ .Values.bmcCollector.intervalSeconds | quote }}
            {{- if .Values.nicoHardwareHealth.enabled }}
            - --nico-health-output
            - {{ .Values.nicoHardwareHealth.inventoryOutputPath | quote }}
            {{- end }}
            {{- if .Values.bmcCollector.insecureTls }}
            - --insecure-tls
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ required "bmcCollector.logLevel is required" .Values.bmcCollector.logLevel | quote }}
            - name: FLEETINT_BACKEND_URL
              value: {{ required "bmcCollector.backendUrl is required" .Values.bmcCollector.backendUrl | quote }}
            - name: FLEETINT_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "bmcCollector.agentTokenSecretName is required" .Values.bmcCollector.agentTokenSecretName | quote }}
                  key: agent-token
            {{- with .Values.bmcCollector.proxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bmcCollector.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bmcCollector.proxy.allProxy }}
            - name: ALL_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bmcCollector.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: hardware-config
              mountPath: /etc/fleet-intelligence
              readOnly: true
            {{- if .Values.nicoHardwareHealth.enabled }}
            - name: nico-inventory
              mountPath: {{ dir .Values.nicoHardwareHealth.inventoryOutputPath | quote }}
            {{- end }}
        {{- if .Values.nicoHardwareHealth.enabled }}
        - name: nico-hardware-health
          image: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthImage" . | quote }}
          imagePullPolicy: {{ .Values.nicoHardwareHealth.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - /etc/nico-health/{{ .Values.nicoHardwareHealth.config.secretKey }}
          ports:
            - name: metrics
              containerPort: {{ .Values.nicoHardwareHealth.service.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 300
            failureThreshold: 3
          volumeMounts:
            - name: nico-config
              mountPath: /etc/nico-health
              readOnly: true
            - name: nico-inventory
              mountPath: {{ dir .Values.nicoHardwareHealth.inventoryOutputPath | quote }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.nicoHardwareHealth.tlsSecretName }}
            - name: tls
              mountPath: /var/run/secrets/spiffe.io
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: hardware-config
          secret:
            secretName: {{ required "config.secretName is required" .Values.config.secretName | quote }}
            items:
              - key: {{ .Values.config.secretKey | quote }}
                path: {{ .Values.config.secretKey | quote }}
                mode: 0440
        {{- if .Values.nicoHardwareHealth.enabled }}
        - name: nico-config
          secret:
            secretName: {{ required "nicoHardwareHealth.config.secretName is required when NICo hardware health is enabled" .Values.nicoHardwareHealth.config.secretName | quote }}
            items:
              - key: {{ .Values.nicoHardwareHealth.config.secretKey | quote }}
                path: {{ .Values.nicoHardwareHealth.config.secretKey | quote }}
                mode: 0440
        - name: nico-inventory
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.nicoHardwareHealth.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ .Values.nicoHardwareHealth.tlsSecretName | quote }}
        {{- end }}
        {{- end }}
