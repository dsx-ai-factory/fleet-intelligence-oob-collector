apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.fullname" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet-intelligence-oob-collector.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ include "fleet-intelligence-oob-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.bmcCollector.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - run
            - --config
            - /etc/fleet-intelligence/{{ .Values.config.configKey }}
            - --interval-seconds
            - {{ .Values.bmcCollector.intervalSeconds | quote }}
            - --target-concurrency
            - {{ .Values.bmcCollector.targetConcurrency | quote }}
            - --bmc-max-in-flight
            - {{ .Values.bmcCollector.bmcMaxInFlight | quote }}
            - --bmc-requests-per-second
            - {{ .Values.bmcCollector.bmcRequestsPerSecond | quote }}
            - --bmc-burst
            - {{ .Values.bmcCollector.bmcBurst | quote }}
            - --timeout-seconds
            - {{ .Values.bmcCollector.timeoutSeconds | quote }}
            {{- if .Values.bmcCollector.insecureTls }}
            - --insecure-tls
            {{- end }}
            {{- if not .Values.bmcCollector.latencyProbe }}
            - --disable-latency-probe
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ required "bmcCollector.logLevel is required" .Values.bmcCollector.logLevel | quote }}
            - name: FLEETINT_BACKEND_URL
              value: {{ required "bmcCollector.backendUrl is required" .Values.bmcCollector.backendUrl | quote }}
            - name: FLEETINT_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "bmcCollector.agentTokenSecretName is required" .Values.bmcCollector.agentTokenSecretName | quote }}
                  key: agent-token
            {{- with .Values.bmcCollector.proxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bmcCollector.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bmcCollector.proxy.allProxy }}
            - name: ALL_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bmcCollector.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: hardware-config
              mountPath: /etc/fleet-intelligence
              readOnly: true
            {{- if .Values.credentials.secrets }}
            - name: bmc-credentials
              mountPath: /run/secrets/bmc
              readOnly: true
            {{- end }}
      volumes:
        - name: hardware-config
          configMap:
            name: {{ required "config.configMapName is required" .Values.config.configMapName | quote }}
            items:
              - key: {{ .Values.config.configKey | quote }}
                path: {{ .Values.config.configKey | quote }}
                mode: 0440
        {{- if .Values.credentials.secrets }}
        - name: bmc-credentials
          projected:
            defaultMode: 0440
            sources:
              {{- range .Values.credentials.secrets }}
              - secret:
                  name: {{ required "credentials.secrets[].name is required" .name | quote }}
                  items:
                    - key: username
                      path: {{ printf "%s/username" .target | quote }}
                    - key: password
                      path: {{ printf "%s/password" .target | quote }}
              {{- end }}
        {{- end }}
