{{- if .Values.bmcCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.fullname" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.bmcCollector.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/deployment-config: {{ include (print $.Template.BasePath "/collector-deployment-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "fleet-intelligence-oob-collector.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "fleet-intelligence-oob-collector.scheduling" .Values.bmcCollector | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ include "fleet-intelligence-oob-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.bmcCollector.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - run
            - --deployment-config
            - /etc/fleet-intelligence-reporting/deployment.json
            - --config
            - /etc/fleet-intelligence/config.toml
            - --interval-seconds
            - {{ .Values.bmcCollector.intervalSeconds | int | quote }}
            - --target-concurrency
            - {{ .Values.bmcCollector.targetConcurrency | int | quote }}
            - --bmc-max-in-flight
            - {{ .Values.bmcCollector.redfish.maxInFlight | int | quote }}
            - --bmc-requests-per-second
            - {{ .Values.bmcCollector.redfish.requestsPerSecond | int | quote }}
            - --bmc-burst
            - {{ .Values.bmcCollector.redfish.requestsPerSecond | int | quote }}
            - --timeout-seconds
            - {{ .Values.bmcCollector.redfish.timeoutSeconds | int | quote }}
            {{- if .Values.bmcCollector.redfish.insecureTls }}
            - --insecure-tls
            {{- end }}
            {{- if not .Values.bmcCollector.latencyProbe.enabled }}
            - --disable-latency-probe
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ required "bmcCollector.logLevel is required" .Values.bmcCollector.logLevel | quote }}
            - name: FLEETINT_BACKEND_URL
              value: {{ required "backend.url is required" .Values.backend.url | quote }}
            - name: FLEETINT_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.agentToken.existingSecret is required" .Values.backend.agentToken.existingSecret | quote }}
                  key: {{ .Values.backend.agentToken.secretKey | quote }}
            {{- include "fleet-intelligence-oob-collector.proxyEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.bmcCollector.resources | nindent 12 }}
          volumeMounts:
            - name: deployment-reporting
              mountPath: /etc/fleet-intelligence-reporting
              readOnly: true
            - name: hardware-config
              mountPath: /etc/fleet-intelligence
              readOnly: true
            - name: bmc-credentials
              mountPath: /run/secrets/bmc
              readOnly: true
      volumes:
        - name: deployment-reporting
          configMap:
            name: {{ include "fleet-intelligence-oob-collector.reportingName" . }}
            items:
              - key: deployment.json
                path: deployment.json
                mode: 0440
        - name: hardware-config
          configMap:
            name: {{ include "fleet-intelligence-oob-collector.fullname" . }}-config
            items:
              - key: collector.toml
                path: config.toml
                mode: 0440
        - name: bmc-credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.credentials.secretKey | quote }}
                path: credentials.json
{{- end }}
