{{- $nico := dict
  "enabled" .Values.nicoHardwareHealth.enabled
  "imageTag" (default .Chart.Version .Values.nicoHardwareHealth.image.tag)
  "metricsPrefix" .Values.nicoHardwareHealth.metricsPrefix
  "metricsPort" .Values.nicoHardwareHealth.service.port
  "serviceEnabled" .Values.nicoHardwareHealth.service.enabled
  "tlsEnabled" (not (empty .Values.nicoHardwareHealth.tlsSecretName))
}}
{{- $telemetry := dict
  "enabled" .Values.otelGateway.enabled
  "imageTag" .Values.otelGateway.image.tag
  "replicas" .Values.otelGateway.replicas
  "grpcPort" .Values.otelGateway.service.grpcPort
  "httpPort" .Values.otelGateway.service.httpPort
  "terminationGracePeriodSeconds" .Values.otelGateway.terminationGracePeriodSeconds
  "networkPolicyEnabled" .Values.otelGateway.networkPolicy.enabled
  "memoryLimiter" (dict
    "limitPercentage" .Values.otelGateway.memoryLimiter.limitPercentage
    "spikeLimitPercentage" .Values.otelGateway.memoryLimiter.spikeLimitPercentage)
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-intelligence-oob-collector.reportingName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
data:
  deployment.json: |
    {{- dict "nico" $nico "telemetry" $telemetry | toPrettyJson | nindent 4 }}
