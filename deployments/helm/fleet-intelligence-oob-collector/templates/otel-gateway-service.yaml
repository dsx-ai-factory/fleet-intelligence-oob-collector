{{- if .Values.otelGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-intelligence-oob-collector.otelGatewayName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  type: ClusterIP
  selector:
    {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
{{- end }}
