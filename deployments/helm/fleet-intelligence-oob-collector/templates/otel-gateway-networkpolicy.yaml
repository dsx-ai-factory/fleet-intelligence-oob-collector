{{- if and .Values.nicoHardwareHealth.enabled .Values.nicoHardwareHealth.otelGateway.enabled .Values.nicoHardwareHealth.otelGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleet-intelligence-oob-collector.otelGatewayName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: nico-hardware-health
      ports:
        - protocol: TCP
          port: {{ .Values.nicoHardwareHealth.otelGateway.service.port }}
{{- end }}
