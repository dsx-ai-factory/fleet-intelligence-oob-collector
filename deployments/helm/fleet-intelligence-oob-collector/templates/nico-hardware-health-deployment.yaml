{{- if .Values.nicoHardwareHealth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: nico-hardware-health
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nico-hardware-health
  template:
    metadata:
      labels:
        {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nico-hardware-health
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nico-hardware-health
          image: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthImage" . | quote }}
          imagePullPolicy: {{ .Values.nicoHardwareHealth.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - /etc/fleet-intelligence/{{ .Values.config.secretKey }}
          ports:
            - name: metrics
              containerPort: {{ .Values.nicoHardwareHealth.service.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 300
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/fleet-intelligence
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.nicoHardwareHealth.tlsSecretName }}
            - name: tls
              mountPath: /var/run/secrets/spiffe.io
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ required "config.secretName is required" .Values.config.secretName | quote }}
            items:
              - key: {{ .Values.config.secretKey | quote }}
                path: {{ .Values.config.secretKey | quote }}
                mode: 0440
        - name: tmp
          emptyDir: {}
        {{- if .Values.nicoHardwareHealth.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ .Values.nicoHardwareHealth.tlsSecretName | quote }}
        {{- end }}
{{- end }}
