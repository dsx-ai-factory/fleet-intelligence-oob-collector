{{- if .Values.nicoHardwareHealth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: nico-hardware-health
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nico-hardware-health
  template:
    metadata:
      labels:
        {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nico-hardware-health
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-nico-config
          image: {{ include "fleet-intelligence-oob-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.bmcCollector.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - render-nico-config
            - --config
            - /etc/fleet-intelligence/{{ .Values.config.configKey }}
            - --output
            - /etc/nico-health/config.toml
            - --otlp-endpoint
            {{- if .Values.otelGateway.enabled }}
            - {{ printf "http://%s:%v" (include "fleet-intelligence-oob-collector.otelGatewayName" .) .Values.otelGateway.service.grpcPort | quote }}
            {{- else }}
            - {{ required "nicoHardwareHealth.otlpEndpoint is required when the OTEL gateway is disabled" (.Values.nicoHardwareHealth.otlpEndpoint | trim) | quote }}
            {{- end }}
            - --metrics-endpoint
            - {{ printf "0.0.0.0:%v" .Values.nicoHardwareHealth.service.port | quote }}
            - --metrics-prefix
            - {{ required "nicoHardwareHealth.metricsPrefix is required" .Values.nicoHardwareHealth.metricsPrefix | quote }}
          volumeMounts:
            - name: collector-config
              mountPath: /etc/fleet-intelligence
              readOnly: true
            - name: bmc-credentials
              mountPath: /run/secrets/bmc
              readOnly: true
            - name: nico-hardware-health-config
              mountPath: /etc/nico-health
      containers:
        - name: nico-hardware-health
          image: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthImage" . | quote }}
          imagePullPolicy: {{ .Values.nicoHardwareHealth.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - /etc/nico-health/config.toml
          ports:
            - name: metrics
              containerPort: {{ .Values.nicoHardwareHealth.service.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 300
            failureThreshold: 3
          volumeMounts:
            - name: nico-hardware-health-config
              mountPath: /etc/nico-health
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: bmc-credentials
              mountPath: /run/secrets/bmc
              readOnly: true
            {{- if .Values.nicoHardwareHealth.tlsSecretName }}
            - name: tls
              mountPath: /var/run/secrets/spiffe.io
              readOnly: true
            {{- end }}
      volumes:
        - name: collector-config
          configMap:
            name: {{ required "config.configMapName is required" .Values.config.configMapName | quote }}
            items:
              - key: {{ .Values.config.configKey | quote }}
                path: {{ .Values.config.configKey | quote }}
                mode: 0440
        - name: nico-hardware-health-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
        - name: bmc-credentials
          secret:
            secretName: {{ required "credentials.existingSecret is required" .Values.credentials.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.credentials.secretKey | quote }}
                path: credentials.json
        {{- if .Values.nicoHardwareHealth.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ .Values.nicoHardwareHealth.tlsSecretName | quote }}
        {{- end }}
{{- end }}
