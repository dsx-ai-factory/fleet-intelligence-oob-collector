{{- if and .Values.nicoHardwareHealth.enabled (eq .Values.nicoHardwareHealth.deploymentMode "managed") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: nico-hardware-health
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nico-hardware-health
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.nicoHardwareHealth.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fleet-intelligence-oob-collector.nicoHardwareHealthSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nico-hardware-health
    spec:
      {{- include "fleet-intelligence-oob-collector.scheduling" .Values.nicoHardwareHealth | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-nico-config
          image: {{ include "fleet-intelligence-oob-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.bmcCollector.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - render-nico-config
            - --config
            - /etc/fleet-intelligence/config.toml
            - --output
            - /etc/nico-health/config.toml
            - --otlp-endpoint
            {{- if .Values.otelGateway.enabled }}
            - {{ printf "http://%s:4317" (include "fleet-intelligence-oob-collector.otelGatewayName" .) | quote }}
            {{- else }}
            - {{ required "telemetry.endpoint is required when the OTEL gateway is disabled" (.Values.telemetry.endpoint | trim) | quote }}
            {{- end }}
            - --metrics-endpoint
            - "0.0.0.0:9009"
            - --metrics-prefix
            - fleetint
            - --resource-status-firmware-poll-interval-seconds
            - {{ .Values.nicoHardwareHealth.resourceStatus.firmwarePollIntervalSeconds | quote }}
            {{- if not .Values.nicoHardwareHealth.resourceStatus.enabled }}
            - --disable-resource-status-collection
            {{- end }}
          volumeMounts:
            - name: collector-config
              mountPath: /etc/fleet-intelligence
              readOnly: true
            - name: bmc-credentials
              mountPath: /run/secrets/bmc
              readOnly: true
            - name: nico-hardware-health-config
              mountPath: /etc/nico-health
      containers:
        - name: nico-hardware-health
          image: {{ include "fleet-intelligence-oob-collector.nicoHardwareHealthImage" . | quote }}
          imagePullPolicy: {{ .Values.nicoHardwareHealth.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - /etc/nico-health/config.toml
          env:
            - name: RUST_LOG
              value: {{ .Values.nicoHardwareHealth.logLevel | quote }}
            {{- include "fleet-intelligence-oob-collector.proxyEnv" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9009
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 300
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nicoHardwareHealth.resources | nindent 12 }}
          volumeMounts:
            - name: nico-hardware-health-config
              mountPath: /etc/nico-health
              readOnly: true
            - name: bmc-credentials
              mountPath: /run/secrets/bmc
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: collector-config
          configMap:
            name: {{ include "fleet-intelligence-oob-collector.fullname" . }}-config
            items:
              - key: collector.toml
                path: config.toml
                mode: 0440
        - name: nico-hardware-health-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: bmc-credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.credentials.secretKey | quote }}
                path: credentials.json

{{- end }}
