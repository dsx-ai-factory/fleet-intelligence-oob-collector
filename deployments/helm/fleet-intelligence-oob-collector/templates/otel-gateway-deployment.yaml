{{- if and .Values.nicoHardwareHealth.enabled .Values.nicoHardwareHealth.otelGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.otelGatewayName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  replicas: {{ .Values.nicoHardwareHealth.otelGateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-gateway
  template:
    metadata:
      labels:
        {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-gateway-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.nicoHardwareHealth.otelGateway.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-gateway
          image: {{ include "fleet-intelligence-oob-collector.otelGatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.nicoHardwareHealth.otelGateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: BACKEND_ENDPOINT
              value: {{ printf "%s/api/v1/health" (trimSuffix "/" .Values.bmcCollector.backendUrl) | quote }}
            - name: ENROLL_ENDPOINT
              value: {{ printf "%s/api/v1/health/enroll" (trimSuffix "/" .Values.bmcCollector.backendUrl) | quote }}
            - name: SAK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "bmcCollector.agentTokenSecretName is required" .Values.bmcCollector.agentTokenSecretName | quote }}
                  key: agent-token
            - name: HTTP_PROXY
              value: {{ .Values.bmcCollector.proxy.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.bmcCollector.proxy.httpsProxy | quote }}
            - name: ALL_PROXY
              value: {{ .Values.bmcCollector.proxy.allProxy | quote }}
            - name: NO_PROXY
              value: {{ .Values.bmcCollector.proxy.noProxy | quote }}
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.nicoHardwareHealth.otelGateway.service.port }}
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nicoHardwareHealth.otelGateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "fleet-intelligence-oob-collector.otelGatewayName" . }}
{{- end }}
