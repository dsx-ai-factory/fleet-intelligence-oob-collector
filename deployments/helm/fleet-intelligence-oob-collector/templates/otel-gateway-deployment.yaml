{{- if .Values.otelGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-intelligence-oob-collector.otelGatewayName" . }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  replicas: {{ .Values.otelGateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-gateway-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.otelGateway.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "fleet-intelligence-oob-collector.otelGatewaySelectorLabels" . | nindent 14 }}
      containers:
        - name: otel-gateway
          image: {{ include "fleet-intelligence-oob-collector.otelGatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.otelGateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: BACKEND_ENDPOINT
              value: {{ required "otelGateway.backendEndpoint is required when otelGateway.enabled=true" .Values.otelGateway.backendEndpoint | trimSuffix "/" | quote }}
            - name: ENROLL_ENDPOINT
              value: {{ required "otelGateway.enroll.endpoint is required when otelGateway.enabled=true" .Values.otelGateway.enroll.endpoint | quote }}
            - name: SAK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet-intelligence-oob-collector.otelGatewayEnrollSecretName" . | quote }}
                  key: {{ .Values.otelGateway.enroll.secretKey | quote }}
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.otelGateway.service.grpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.otelGateway.service.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.otelGateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "fleet-intelligence-oob-collector.otelGatewayName" . }}
{{- end }}
