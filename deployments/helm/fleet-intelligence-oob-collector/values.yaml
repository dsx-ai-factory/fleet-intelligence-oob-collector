# Shared hardware inventory.
inventory:
  # address is the BMC IP; mac also keys credential overrides.
  targets: []
  # - kind: compute # compute | nvswitch | power_shelf | unknown
  #   name: node-01
  #   address: 192.0.2.10
  #   mac: "00:11:22:33:44:55"
  #   credentialsProfile: bmc # Profile name in the credentials file.
  computeZone: "" # Default compute zone for every target.
  nodeGroup: "" # Default node group for every target.
  labels: {} # Default labels applied to every target.

# Shared BMC JSON file; credential values belong in the Secret.
credentials:
  existingSecret: fleet-intelligence-bmc-credentials
  secretKey: credentials.json

# Fleet Intelligence destination and shared bootstrap token.
backend:
  url: https://data.fleet-intelligence.nvidia.com
  agentToken:
    existingSecret: fleet-intelligence-oob-collector-agent-token
    secretKey: agent-token

# External OTLP/gRPC endpoint; requires otelGateway.enabled=false.
telemetry:
  endpoint: ""

# Registry pull Secrets.
imagePullSecrets: []
# - name: ghcr-pull-secret

# Proxy URLs must not contain credentials.
proxy:
  enabled: false
  httpProxy: ""
  httpsProxy: ""
  allProxy: ""
  noProxy: localhost,127.0.0.1,.svc,.cluster.local

bmcCollector:
  enabled: true
  image:
    repository: ghcr.io/dsx-ai-factory/fleet-intelligence-oob-collector
    # An empty tag uses the chart version.
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  logLevel: info
  intervalSeconds: 86400
  targetConcurrency: 64
  redfish:
    maxInFlight: 4
    requestsPerSecond: 10
    timeoutSeconds: 30
    # Disables verification and permits interception; collector only; NICo does not verify BMC certificates.
    insecureTls: false
  latencyProbe:
    enabled: true

nicoHardwareHealth:
  enabled: true
  # Optional flat controls; null retains the existing NICo behavior.
  sensorFetchIntervalSeconds: null
  bmcRequestConcurrency: null
  endpointDiscoveryIntervalSeconds: null
  discoveryRefreshIntervalSeconds: null
  discoveryConcurrency: null
  sensorsEnabled: null
  includeSensorThresholds: null
  metricsEnabled: null
  metricsFetchIntervalSeconds: null
  telemetryEnabled: null
  telemetryFetchIntervalSeconds: null
  firmwareEnabled: null
  firmwareRefreshIntervalSeconds: null
  managerEnabled: null
  managerPollIntervalSeconds: null
  leakDetectorEnabled: null
  leakDetectorPollIntervalSeconds: null
  leakDetectorStateRefreshIntervalSeconds: null
  logsEnabled: null
  logsMode: null
  logsSseInitialBackoffSeconds: null
  logsSseMaxBackoffSeconds: null
  logsCollectionIntervalSeconds: null
  logsStateRefreshIntervalSeconds: null
  logsExcludeServices: null
  logsSkipInitialHistory: null
  logsAutoSseNotAvailableThreshold: null
  logsAutoConnectFailureWindowSeconds: null
  logsAutoConnectFailureThreshold: null
  logsAutoRetrySseAfterDowngrade: null
  reachabilityEnabled: null
  reachabilityIntervalSeconds: null
  reachabilityTimeoutSeconds: null
  reachabilityLogMode: null
  rateLimitEnabled: null
  rateLimitBucketBurst: null
  rateLimitBucketReplenishMilliseconds: null
  rateLimitMaxJitterMilliseconds: null
  image:
    repository: ghcr.io/dsx-ai-factory/nico-hardware-health
    # An empty tag uses the chart version.
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  logLevel: info

otelGateway:
  enabled: true
  image:
    repository: ghcr.io/nvidia/fleetint-otelcol
    tag: 1.4.0 # Required; independent of the chart version.
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  logLevel: warn
  replicas: 1
