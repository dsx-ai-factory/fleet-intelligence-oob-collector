# Existing Docker registry Secrets used to pull chart images.
imagePullSecrets: []

# Existing Secret containing the OOB collector's [[machines]] TOML configuration.
config:
  secretName: fleet-intelligence-config
  secretKey: config.toml

# Fleet Intelligence BMC inventory and attestation collector.
bmcCollector:
  image:
    repository: ghcr.io/nvidia/fleet-intelligence-oob-collector
    # Defaults to the chart version when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Fleet Intelligence API base URL, without a /v1/agent suffix.
  backendUrl: https://data.fleet-intelligence.nvidia.com
  # Secret containing the `agent-token` key.
  agentTokenSecretName: fleet-intelligence-oob-collector-agent-token
  # Rust tracing filter. Accepts levels such as debug or full RUST_LOG directives.
  logLevel: info
  # Optional plain proxy settings rendered as container environment variables.
  proxy:
    httpProxy: ""
    httpsProxy: ""
    allProxy: ""
    noProxy: ""
  intervalSeconds: 86400
  insecureTls: false

# Optional NICo Redfish hardware-health service. Its TOML configuration may
# contain BMC credentials, so it is only accepted through an existing Secret.
nicoHardwareHealth:
  enabled: true
  # Shared generated inventory path. The collector writes this file only when
  # NICo hardware health is enabled.
  inventoryOutputPath: /var/lib/fleetint/nico-health-inventory.json
  # Existing Secret containing NICo Health's service TOML. Its cluster endpoint
  # source must read inventoryOutputPath.
  config:
    secretName: nico-hardware-health-config
    secretKey: config.toml
  image:
    repository: ghcr.io/nvidia/nico-hardware-health
    # Defaults to the chart version when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Optional Secret with ca.crt, tls.crt, and tls.key for NICo API mTLS.
  tlsSecretName: ""
  service:
    enabled: true
    port: 9009
