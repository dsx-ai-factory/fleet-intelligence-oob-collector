# Existing Docker registry Secrets used to pull chart images.
imagePullSecrets: []

# Existing ConfigMap containing the password-free Fleet Intelligence OOB
# collector TOML.
config:
  configMapName: fleet-intelligence-config
  configKey: config.toml

# Existing Kubernetes Secrets containing BMC credential files. Secret values
# are mounted directly and are never rendered into Helm release state.
credentials:
  secrets: []
  # - name: default-bmc-credentials
  #   target: default
  # - name: exceptional-node-bmc-credentials
  #   target: node-02

# Fleet Intelligence BMC inventory and attestation collector.
bmcCollector:
  image:
    repository: ghcr.io/dsx-ai-factory/fleet-intelligence-oob-collector
    # Defaults to the chart version when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Fleet Intelligence API base URL, without a /v1/agent suffix.
  backendUrl: https://data.fleet-intelligence.nvidia.com
  # Secret containing the `agent-token` key.
  agentTokenSecretName: fleet-intelligence-oob-collector-agent-token
  # Rust tracing filter. Accepts levels such as debug or full RUST_LOG directives.
  logLevel: info
  # Optional plain proxy settings rendered as container environment variables.
  proxy:
    httpProxy: ""
    httpsProxy: ""
    allProxy: ""
    noProxy: ""
  intervalSeconds: 86400
  insecureTls: false
  # Maximum number of target inventory or attestation workflows run concurrently.
  targetConcurrency: 64
  # Maximum number of concurrent Redfish requests to a single BMC.
  bmcMaxInFlight: 4
  # Sustained Redfish request rate allowed for each BMC.
  bmcRequestsPerSecond: 10
  # Per-BMC Redfish request burst capacity.
  bmcBurst: 10
  # Timeout for each Redfish request.
  timeoutSeconds: 30

# Optional NICo Redfish hardware-health service. Its generated TOML
# configuration may contain BMC credentials and is kept in a memory-backed
# pod-local volume.
nicoHardwareHealth:
  enabled: true
  # External OTLP/gRPC endpoint used only when otelGateway.enabled is false.
  otlpEndpoint: ""
  metricsPrefix: fleetint
  image:
    repository: ghcr.io/dsx-ai-factory/nico-hardware-health
    # Defaults to the chart version when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Optional Secret with ca.crt, tls.crt, and tls.key for NICo API mTLS.
  tlsSecretName: ""
  service:
    enabled: true
    port: 9009

# Authenticated OpenTelemetry gateway for NICo and future OOB OTLP export.
# NICo is pointed at this gateway automatically when it is enabled.
otelGateway:
  enabled: true
  image:
    repository: ghcr.io/nvidia/fleetint-otelcol
    tag: 1.4.0
    pullPolicy: IfNotPresent
  replicas: 1
  terminationGracePeriodSeconds: 30

  # Optional overrides. Empty values derive from bmcCollector.backendUrl and
  # bmcCollector.agentTokenSecretName.
  enroll:
    endpoint: ""
    existingSecret: ""
    secretKey: agent-token
  backendEndpoint: ""

  service:
    grpcPort: 4317
    httpPort: 4318
  networkPolicy:
    enabled: true
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  memoryLimiter:
    limitPercentage: 80
    spikeLimitPercentage: 20
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
