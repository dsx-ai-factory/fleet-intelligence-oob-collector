# Apply separately after creating the backend Kubernetes auth role and policy.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: fleet-intelligence
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: fleet-intelligence
spec:
  address: https://vault.example.com:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: oob-credentials-reader
  namespace: fleet-intelligence
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: oob-credentials-reader
    serviceAccount: vault-reader
    audiences:
      - vault
