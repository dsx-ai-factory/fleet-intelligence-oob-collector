inventory:
  computeZone: test-zone
  nodeGroup: test-group
  labels:
    site: test
  targets:
  - kind: compute
    name: node-01
    mac: 00:11:22:33:44:55
    credentialsProfile: " bmc " # Snapshot verifies surrounding whitespace is trimmed.
    address: 192.0.2.10
  - kind: nvswitch
    name: switch-01
    mac: 00:11:22:33:44:56
    credentialsProfile: switch
    address: 192.0.2.11
  - kind: power_shelf
    name: shelf-01
    mac: 00:11:22:33:44:57
    address: 192.0.2.12
credentials:
  existingSecret: bmc-credentials-test
  secretKey: shared.json
backend:
  url: https://fleet.test.example
  collectorToken:
    existingSecret: fleet-intelligence-oob-collector-token-test
    secretKey: collector-token
imagePullSecrets:
- name: ghcr-pull-secret-test
proxy:
  enabled: true
  httpProxy: http://proxy.test.example:3128
  httpsProxy: http://proxy.test.example:3128
  allProxy: ''
  noProxy: localhost,127.0.0.1,.svc,.cluster.local
bmcCollector:
  targetConcurrency: 7
  redfish:
    maxInFlight: 2
    requestsPerSecond: 3
    timeoutSeconds: 45
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
  - key: monitoring
    operator: Exists
    effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: monitoring
            operator: In
            values:
            - enabled
  podAnnotations:
    example.com/workload: bmcCollector
nicoHardwareHealth:
  enabled: true
  config:
    sensorFetchIntervalSeconds: 120
    bmcRequestConcurrency: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
  - key: monitoring
    operator: Exists
    effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: monitoring
            operator: In
            values:
            - enabled
  podAnnotations:
    example.com/workload: nicoHardwareHealth
otelGateway:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
  - key: monitoring
    operator: Exists
    effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: monitoring
            operator: In
            values:
            - enabled
  podAnnotations:
    example.com/workload: otelGateway
