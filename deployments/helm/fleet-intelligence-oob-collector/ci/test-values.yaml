bmcCollector:
  backendUrl: https://data.fleet-intelligence.nvidia.com
  agentTokenSecretName: fleet-intelligence-oob-collector-agent-token-test
  targetConcurrency: 7
  bmcMaxInFlight: 2
  bmcRequestsPerSecond: 3
  bmcBurst: 4
  timeoutSeconds: 45
  proxy:
    httpProxy: http://proxy.test.example:3128
    httpsProxy: http://proxy.test.example:3128
    allProxy: ""
    noProxy: localhost,127.0.0.1,.svc,.cluster.local
config:
  configMapName: fleet-intelligence-config-test
credentials:
  secrets:
    - name: default-bmc-credentials-test
      target: default
    - name: node-02-bmc-credentials-test
      target: node-02
imagePullSecrets:
  - name: ghcr-pull-secret-test
nicoHardwareHealth:
  enabled: true
  tlsSecretName: nico-hardware-health-tls-test
otelGateway:
  enroll:
    endpoint: https://telemetry.test.example/api/v1/health/enroll
    existingSecret: fleet-intelligence-otel-gateway-token-test
  backendEndpoint: https://telemetry.test.example/api/v1/health
  podDisruptionBudget:
    enabled: true
