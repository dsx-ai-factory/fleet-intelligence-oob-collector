{{- include "fleet-intelligence-oob-collector.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-intelligence-oob-collector.fullname" . }}-config
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
data:
  collector.toml: |
    {{- regexReplaceAll "(?m)^[ \\t]+$" (include "fleet-intelligence-oob-collector.collectorConfig" . | trim | nindent 4) "" }}
