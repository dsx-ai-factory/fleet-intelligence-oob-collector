# Follow DSX Starfleet SSA Client Provisioning. Replace your-component with
# the SSA client onboarded by your platform administrator with carbide scope.
# Wire the reader service account and shared VaultAuth as required by your site.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-reader
  namespace: fleet-intelligence
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fi-nico-ssa-credentials
  namespace: fleet-intelligence
spec:
  type: kv-v1
  vaultAuthRef: vault-secrets-operator-system/vault-dgxc-dsx-auth
  mount: services/dsx/clients/your-component
  path: issue/creds
  destination:
    name: fi-nico-ssa-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        client_id:
          text: '{{ get .Secrets "client_id" }}'
        client_secret:
          text: '{{ get .Secrets "secret" }}'
