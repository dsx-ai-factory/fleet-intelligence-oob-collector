# Apply separately after provisioning Vault entries and an authorized VaultAuth.
# Adapt namespace, auth reference, paths, and restart Deployment names.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fleet-intelligence-oob-collector-enrollment-token
  namespace: fleet-intelligence
spec:
  vaultAuthRef: oob-credentials-reader
  type: kv-v2
  mount: credentials
  path: backend
  refreshAfter: 60s
  destination:
    name: fleet-intelligence-oob-collector-enrollment-token
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        enrollment-token:
          text: |
            {{- $v := get .Secrets "token" -}}
            {{- if not (kindIs "string" $v) -}}
            {{- fail "missing or invalid backend token field" -}}{{- end -}}
            {{- $v = trim $v -}}
            {{- if eq $v "" -}}
            {{- fail "missing or invalid backend token field" -}}{{- end -}}
            {{- $v -}}
  rolloutRestartTargets:
    - kind: Deployment
      name: fleet-intelligence-oob-collector
    - kind: Deployment
      name: fleet-intelligence-oob-collector-otel-gateway
