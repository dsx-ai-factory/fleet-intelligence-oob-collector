# Apply separately from the collector chart after provisioning Vault access.
# Store the complete credentials JSON as the string field "credentials".
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fleet-intelligence-bmc-credentials
  namespace: fleet-intelligence
spec:
  vaultAuthRef: oob-credentials-reader
  type: kv-v2
  mount: bmc
  path: collector
  refreshAfter: 60s
  destination:
    name: fleet-intelligence-bmc-credentials
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        credentials.json:
          text: |
            {{- $v := get .Secrets "credentials" -}}
            {{- if or (not (kindIs "string" $v)) (eq $v "") -}}
            {{- fail "missing or invalid credentials field" -}}{{- end -}}
            {{- $v -}}
