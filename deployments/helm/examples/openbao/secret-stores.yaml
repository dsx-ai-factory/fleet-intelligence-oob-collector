---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  namespace: fleet-intelligence
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-bmc
  namespace: fleet-intelligence
spec:
  provider:
    vault:
      server: https://openbao.example.com:8200
      path: bmc
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: oob-credentials-reader
          serviceAccountRef:
            name: openbao-reader
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-tokens
  namespace: fleet-intelligence
spec:
  provider:
    vault:
      server: https://openbao.example.com:8200
      path: credentials
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: oob-credentials-reader
          serviceAccountRef:
            name: openbao-reader
            audiences:
            - vault
