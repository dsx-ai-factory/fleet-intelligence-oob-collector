---
# Trim surrounding service key whitespace and reject missing or blank source fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-intelligence-service-key
  namespace: fleet-intelligence
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-credentials
    kind: SecretStore
  target:
    name: fleet-intelligence-service-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        service-key: |-
          {{- $serviceKey := trim .serviceKey -}}
          {{- if eq $serviceKey "" -}}{{- .nonEmptyServiceKeyRequired -}}{{- end -}}
          {{- $serviceKey -}}
  data:
  - secretKey: serviceKey
    remoteRef:
      key: backend
      property: service-key
