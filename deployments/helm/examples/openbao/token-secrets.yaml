---
# Trim surrounding token whitespace and reject missing or blank source fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-intelligence-oob-collector-enrollment-token
  namespace: fleet-intelligence
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-tokens
    kind: SecretStore
  target:
    name: fleet-intelligence-oob-collector-enrollment-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        enrollment-token: |-
          {{- $token := trim .token -}}
          {{- if eq $token "" -}}{{- .nonEmptyTokenRequired -}}{{- end -}}
          {{- $token -}}
  data:
  - secretKey: token
    remoteRef:
      key: backend
      property: token
