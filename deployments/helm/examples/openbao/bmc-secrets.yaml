# Apply separately after provisioning OpenBao access and the SecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-intelligence-bmc-credentials
  namespace: fleet-intelligence
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-bmc
    kind: SecretStore
  target:
    name: fleet-intelligence-bmc-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        credentials.json: '{{- if eq .credentials "" -}}{{- .nonEmptyCredentialsRequired -}}{{- end -}}{{ .credentials }}'
  data:
    - secretKey: credentials
      remoteRef:
        key: collector
        property: credentials
