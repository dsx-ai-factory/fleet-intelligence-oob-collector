# Applied explicitly by package hooks; not registered for boot-time processing.
# Give the service read access to existing prototype configuration and standard
# credentials. Keep administrator ownership and never follow credential symlinks.
z /etc/fleetint-oob 0750 root fleetint-oob -
z /etc/fleetint-oob/config.toml 0640 root fleetint-oob -
Z /etc/fleetint-oob/credentials ~0750 root fleetint-oob -
z /etc/fleetint-oob/collector-token 0640 root fleetint-oob -
z /etc/fleetint-oob/service.conf 0600 root root -
