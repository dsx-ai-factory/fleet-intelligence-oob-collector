# Systemd EnvironmentFile: keep root-owned with mode 0600. Set the token locally.
FLEETINT_BACKEND_URL=https://data.fleet-intelligence.nvidia.com
FLEETINT_ENROLLMENT_TOKEN=
# Optional readable token file; takes precedence over FLEETINT_ENROLLMENT_TOKEN.
FLEETINT_ENROLLMENT_TOKEN_FILE=
FLEETINT_INTERVAL_SECONDS=86400
FLEETINT_TARGET_CONCURRENCY=64
FLEETINT_BMC_MAX_IN_FLIGHT=2
FLEETINT_BMC_REQUESTS_PER_SECOND=10
FLEETINT_TIMEOUT_SECONDS=30
FLEETINT_BMC_INSECURE_TLS=true
FLEETINT_DISABLE_LATENCY_PROBE=false
FLEETINT_OTLP_ENDPOINT=http://127.0.0.1:4317
FLEETINT_NICO_RESOURCE_STATUS_ENABLED=true
FLEETINT_NICO_RESOURCE_STATUS_FIRMWARE_POLL_INTERVAL_SECONDS=1800
RUST_LOG=info
FLEETINT_NICO_LOG_LEVEL=warn
FLEETINT_OTEL_GATEWAY_LOG_LEVEL=warn
# Configured bundle components; set false when excluding a component.
FLEETINT_NICO_ENABLED=true
FLEETINT_NICO_TELEMETRY_DESTINATION=bundledGateway
FLEETINT_OTEL_GATEWAY_ENABLED=true
# Gateway URLs must be explicit; EnvironmentFile does not expand variables.
BACKEND_ENDPOINT=https://data.fleet-intelligence.nvidia.com/api/v1/health
ENROLL_ENDPOINT=https://data.fleet-intelligence.nvidia.com/api/v1/health/enroll
# HTTP_PROXY=http://proxy.example.com:3128
# HTTPS_PROXY=http://proxy.example.com:3128
# NO_PROXY=localhost,127.0.0.1
