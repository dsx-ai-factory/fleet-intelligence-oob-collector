# Fleet Intelligence placement; inherited by targets and mirrored to telemetry.
compute_zone = "us-west-dc1"
node_group = "gb200-training"

# Credentials are read from the mounted Kubernetes Secret.
[credentials]
username_file = "/run/secrets/bmc/default/username"
password_file = "/run/secrets/bmc/default/password"

[[racks]]
id = "rack-12"

[racks.nmxc]
ip = "192.0.2.12"
# Defaults to 9370. Without TLS fields, the collector uses plaintext gRPC.
port = 9370
# To enable TLS, set ca_file and optionally the mTLS client pair:
# ca_file = "/run/secrets/nmxc/ca.pem"
# client_cert_file = "/run/secrets/nmxc/tls.crt"
# client_key_file = "/run/secrets/nmxc/tls.key"
# server_name = "nmxc.example.com"

[[targets]]
kind = "compute"
# Optional: inventory `name` and telemetry `machine_name`.
name = "node-01"
ip = "10.0.0.10"
# Optional but recommended stable BMC identity.
mac = "aa:bb:cc:dd:ee:ff"
rack_id = "rack-12"

[[targets]]
kind = "nvswitch"
name = "switch-tray-01"
ip = "10.0.0.11"
username_file = "/run/secrets/bmc/switch-tray-01/username"
password_file = "/run/secrets/bmc/switch-tray-01/password"
rack_id = "rack-12"

[[targets]]
kind = "power_shelf"
name = "power-shelf-01"
ip = "10.0.0.12"
rack_id = "rack-12"
