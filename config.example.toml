# Shared configuration for the Fleet Intelligence OOB collector and hardware
# health service.

[endpoint_sources.carbide_api]
enabled = false

[[endpoint_sources.static_bmc_endpoints]]
ip = "10.0.0.10"
port = 443
mac = "00:11:22:33:44:55"
username = "bmc-username"
password = "bmc-password"

[sinks.health_report]
enabled = false

[sinks.rack_health_report]
enabled = false

[sinks.switch_health_report]
enabled = false

[sinks.power_shelf_health_report]
enabled = false

[sinks.prometheus]
enabled = true

[metrics]
endpoint = "0.0.0.0:9009"
prefix = "nico_hardware_health"
