# Fleet Intelligence placement applied to every machine in this collector.
compute_zone = "az51"
node_group = "dev3-dh1"

[[machines]]
ip = "10.0.0.10"
port = 443
# Optional. When omitted, derives 02:00:<last four IP bytes>.
mac = "aa:bb:cc:dd:ee:ff"
username = "bmc-username"
password = "bmc-password"
# Optional NICo telemetry labels specific to this machine.
labels = { site = "dev", environment = "development" }
