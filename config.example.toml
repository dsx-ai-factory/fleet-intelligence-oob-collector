# Fleet Intelligence OOB collector configuration. NICo hardware health cluster
# discovery consumes the file generated by `--format nico-health`.

[endpoint_sources.carbide_api]
enabled = false

[[endpoint_sources.static_bmc_endpoints]]
ip = "10.0.0.10"
port = 443
mac = "aa:bb:cc:dd:ee:ff"
username = "bmc-username"
password = "bmc-password"
rack = "rack-01"
labels = { compute_zone = "az51", node_group = "dev3-dh1" }

[sinks.health_report]
enabled = false

[sinks.rack_health_report]
enabled = false

[sinks.switch_health_report]
enabled = false

[sinks.power_shelf_health_report]
enabled = false

[sinks.prometheus]
enabled = true

[sinks.otlp]
enabled = true
# For Docker Desktop Kubernetes, replace `localhost` with `host.docker.internal`.
endpoint = "http://localhost:4317"
include_diagnostics = false
batch_size = 512
flush_interval = "2s"

[metrics]
endpoint = "0.0.0.0:9009"
prefix = "fleetint"
