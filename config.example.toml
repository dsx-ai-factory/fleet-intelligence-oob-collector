# Optional NICo telemetry labels applied to every machine in this collector.
[labels]
compute_zone = "az51"
node_group = "dev3-dh1"

# Default BMC credentials inherited by machines without an override. Omit this
# section only when every machine defines a complete credential pair.
[credentials]
username_file = "/run/secrets/bmc/default/username"
password_file = "/run/secrets/bmc/default/password"

[[machines]]
ip = "10.0.0.10"
port = 443
# Optional but recommended as the stable BMC identity. When omitted, derives
# 02:00:<last four IP bytes>.
mac = "aa:bb:cc:dd:ee:ff"
# Optional per-machine credential override. Specify both files together.
# username_file = "/run/secrets/bmc/node-01/username"
# password_file = "/run/secrets/bmc/node-01/password"
# Optional NICo telemetry labels specific to this machine. They override
# top-level labels with the same name.
labels = { site = "dev", environment = "development" }
