# Fleet Intelligence placement; inherited by targets and mirrored to telemetry.
compute_zone = "us-west-dc1"
node_group = "gb200-training"

# Same JSON credentials file as NICo health (profiles and per-MAC overrides).
[credentials]
file = "/run/secrets/bmc/credentials.json"

# Optional NICo load controls; omit fields to retain NICo's defaults.
# [nico]
# sensor_fetch_interval_seconds = 120
# bmc_request_concurrency = 2

[[targets]]
kind = "compute"
credentials_profile = "bmc"
# Optional: inventory `name` and telemetry `machine_name`.
name = "node-01"
ip = "192.0.2.10"
# Required stable BMC identity; use the actual BMC MAC address.
mac = "aa:bb:cc:dd:ee:ff"
labels = { rack = "rack-12" }

[[targets]]
kind = "nvswitch"
credentials_profile = "switch"
name = "switch-tray-01"
ip = "192.0.2.11"
mac = "02:00:0a:00:00:0b"
labels = { rack = "rack-12" }

[[targets]]
kind = "power_shelf"
credentials_profile = "bmc"
name = "power-shelf-01"
ip = "192.0.2.12"
mac = "02:00:0a:00:00:0c"
labels = { rack = "rack-12" }
