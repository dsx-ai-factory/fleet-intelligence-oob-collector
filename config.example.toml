# Fleet Intelligence placement; inherited by machines and mirrored to telemetry.
compute_zone = "us-west-dc1"
node_group = "gb200-training"

# Credentials are read from the mounted Kubernetes Secret.
[credentials]
username_file = "/run/secrets/bmc/default/username"
password_file = "/run/secrets/bmc/default/password"

[[machines]]
# Optional: inventory `name` and telemetry `machine_name`.
name = "node-01"
ip = "10.0.0.10"
# Optional but recommended stable BMC identity.
mac = "aa:bb:cc:dd:ee:ff"
labels = { rack = "rack-12" }

[[machines]]
name = "node-02"
ip = "10.0.0.11"
username_file = "/run/secrets/bmc/node-02/username"
password_file = "/run/secrets/bmc/node-02/password"
labels = { rack = "rack-12" }
