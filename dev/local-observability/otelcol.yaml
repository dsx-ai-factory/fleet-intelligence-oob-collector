# Receives OTLP/gRPC from nico-health and sends logs to Loki while exposing
# metrics for Prometheus to scrape.

receivers:
  otlp:
    protocols:
      grpc:
        # nico-health connects to the host's loopback-mapped port without TLS.
        endpoint: 0.0.0.0:4317

processors:
  resource:
    attributes:
      # The health service's custom OTLP exporter does not set service.name.
      - key: service.name
        value: nico-hardware-health
        action: upsert
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlphttp/loki:
    # The exporter appends /v1/logs to this endpoint.
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      # Preserve resource attributes such as endpoint and machine ID as labels.
      enabled: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
