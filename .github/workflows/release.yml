name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.2.0 or v0.2.0-rc.1'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  IMAGE: nvcr.io/1070195845945670/fleet-intelligence/oob-collector
  NICO_IMAGE: nvcr.io/1070195845945670/fleet-intelligence/nico-hardware-health
  # Pin the NICo hardware-health source used for release images.
  # Includes BMC credential-rejection suppression from
  # dsx-ai-factory/infra-controller#8323.
  NICO_SOURCE_REF: 92c64e5099c0496ae7d6e5291555d9cbebc45976

jobs:
  validate:
    if: ${{ github.ref_type == 'tag' }}
    name: Validate release
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set release version
        id: version
        env:
          VERSION: ${{ env.VERSION_TAG }}
        run: |
          if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Release version must match the selected tag"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a semantic version such as v0.1.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
          printf 'version=%s\n' "${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: 1.95.0
          cache: false
      - run: cargo test --workspace --locked
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint deployments/helm/fleet-intelligence-oob-collector --values deployments/helm/fleet-intelligence-oob-collector/ci/test-values.yaml

  build-image:
    if: ${{ github.ref_type == 'tag' }}
    environment: ngc-publish
    needs: validate
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to NVCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION_TAG }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-image:
    if: ${{ github.ref_type == 'tag' }}
    environment: ngc-publish
    name: Publish image
    needs: [validate, build-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to NVCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
      - name: Create multi-platform image
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          image_args=()
          for digest in *; do
            image_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  build-nico-image:
    if: ${{ github.ref_type == 'tag' }}
    environment: ngc-publish
    needs: validate
    name: Build NICo health image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned NICo source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dsx-ai-factory/infra-controller
          ref: ${{ env.NICO_SOURCE_REF }}
          path: nico-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to NVCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.NICO_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./nico-source
          file: ./Dockerfile.nico-hardware-health
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.NICO_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION_TAG }}
            REVISION=${{ env.NICO_SOURCE_REF }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nico-image-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-nico-image:
    if: ${{ github.ref_type == 'tag' }}
    environment: ngc-publish
    name: Publish NICo health image
    needs: [validate, build-nico-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nico-image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to NVCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.NICO_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
      - name: Create multi-platform image
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ${{ env.NICO_IMAGE }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          image_args=()
          for digest in *; do
            image_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish-chart:
    if: ${{ github.ref_type == 'tag' }}
    environment: ngc-publish
    name: Publish Helm chart
    needs: [validate, publish-image, publish-nico-image]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Package chart
        run: |
          cp LICENSE deployments/helm/fleet-intelligence-oob-collector/LICENSE
          helm package deployments/helm/fleet-intelligence-oob-collector --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Install pinned NGC CLI
        env:
          NGC_CLI_VERSION: '4.36.6'
          NGC_CLI_SHA256: '2972dbe54e80cedae18e82923a9a67a60aef23d041c5790336f8f4b51752bab6'
        run: |
          set -euo pipefail
          ngc_dir=$(mktemp -d "$RUNNER_TEMP/ngc-cli.XXXXXX")
          ngc_home=$(mktemp -d "$RUNNER_TEMP/ngc-home.XXXXXX")
          printf 'NGC_CLI_HOME=%s\n' "$ngc_home" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "$ngc_dir/ngccli_linux.zip" \
            "https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/${NGC_CLI_VERSION}/files/ngccli_linux.zip"
          printf '%s  %s\n' "$NGC_CLI_SHA256" "$ngc_dir/ngccli_linux.zip" | sha256sum --check -
          unzip -q "$ngc_dir/ngccli_linux.zip" -d "$ngc_dir"
          chmod +x "$ngc_dir/ngc-cli/ngc"
          printf '%s\n' "$ngc_dir/ngc-cli" >> "$GITHUB_PATH"
          NGC_CLI_HOME="$ngc_home" "$ngc_dir/ngc-cli/ngc" --version
      - name: Publish chart
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_API_KEY }}
          CHART_TARGET: 1070195845945670/fleet-intelligence/fleet-intelligence-oob-collector
        run: |
          set -euo pipefail
          cd dist
          if ! ngc registry chart info --org 1070195845945670 --team fleet-intelligence "$CHART_TARGET"; then
            ngc registry chart create --org 1070195845945670 --team fleet-intelligence "$CHART_TARGET" --short-desc "Fleet Intelligence out-of-band collector"
          fi
          ngc registry chart push --org 1070195845945670 --team fleet-intelligence "$CHART_TARGET:$VERSION"
      - name: Remove NGC CLI state
        if: always()
        run: |
          if [[ -n "${NGC_CLI_HOME:-}" ]]; then
            rm -rf "$NGC_CLI_HOME"
          fi

  package-ci:
    if: ${{ github.ref_type == 'tag' }}
    name: Test host packages
    needs: validate
    uses: ./.github/workflows/host-packages.yml

  reserve-package-release:
    if: ${{ github.ref_type == 'tag' }}
    name: Reserve package release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.reserve.outputs.release-id }}
    steps:
      - name: Refuse existing releases and reserve a private draft
        id: reserve
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            if (releases.some(release => release.tag_name === tag)) {
              throw new Error(`Release ${tag} already exists; refusing to replace artifacts. Resume failed jobs or use a new version.`);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: tag, draft: true, prerelease: tag.includes('-'),
              generate_release_notes: true,
            });
            core.setOutput('release-id', data.id);

  build-packages:
    if: ${{ github.ref_type == 'tag' }}
    name: Build host packages (${{ matrix.architecture }})
    needs: [reserve-package-release, package-ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release package
        env:
          RELEASE_TAG: ${{ env.VERSION_TAG }}
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          make debian-package PACKAGE_VERSION="${RELEASE_TAG#v}"
          make rpm-package PACKAGE_VERSION="${RELEASE_TAG#v}"
          # One flat upload root preserves the layout expected by signing.
          mkdir -p dist/release
          for format in deb rpm; do
            name="fleetint-oob_${RELEASE_TAG#v}_${PACKAGE_ARCH}.$format"
            case "$format" in deb) source_dir=debian ;; rpm) source_dir=rpm ;; esac
            test -s "dist/$source_dir/$name"
            cp "dist/$source_dir/$name" dist/release/
          done
          test "$(find dist/release -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-packages-${{ matrix.architecture }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  sign-packages:
    if: ${{ github.ref_type == 'tag' }}
    name: Sign and verify host packages
    needs: build-packages
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-packages-*
          path: dist
          merge-multiple: true
      - name: Check signing runner tools and credentials
        env:
          RELEASE_TAG: ${{ env.VERSION_TAG }}
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
        run: |
          for tool in nvsec gpg gpgv ar rpm sha256sum md5sum sha1sum; do
            command -v "$tool" >/dev/null || { echo "Required signing tool is unavailable: $tool" >&2; exit 1; }
          done
          for arch in amd64 arm64; do
            for format in deb rpm; do
              test -s "dist/fleetint-oob_${RELEASE_TAG#v}_${arch}.$format"
            done
          done
          : "${NVSEC_SSA_CLIENT_ID:?Configure signing credentials}"
          : "${NVSEC_SSA_CLIENT_SECRET:?Configure signing credentials}"
      - name: Sign packages, refresh checksums, sign and verify manifest
        env:
          RELEASE_TAG: ${{ env.VERSION_TAG }}
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_LINUX_PACKAGE_SSA_SCOPE: ${{ vars.NVSEC_LINUX_PACKAGE_SSA_SCOPE || 'SIGNING_LINUX_PACKAGE_FLEET_INTELLIGENCE' }}
          NVSEC_LINUX_PACKAGE_JOB_TYPE: ${{ vars.NVSEC_LINUX_PACKAGE_JOB_TYPE || 'LINUX_PACKAGE_FLEET_INTELLIGENCE' }}
          NVSEC_CHECKSUM_SSA_SCOPE: ${{ vars.NVSEC_CHECKSUM_SSA_SCOPE || 'SIGNING_FLEET_INTELLIGENCE' }}
          NVSEC_CHECKSUM_JOB_TYPE: ${{ vars.NVSEC_CHECKSUM_JOB_TYPE || 'FLEET_INTELLIGENCE' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}
        run: scripts/prepare-package-release.sh dist "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-package-release
          path: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/checksums.txt.asc
            dist/fleet-intelligence.pub.asc
            dist/verify-linux-package-signature.sh
          if-no-files-found: error
          retention-days: 7

  upload-package-assets:
    if: ${{ github.ref_type == 'tag' }}
    name: Upload verified host packages to draft
    needs: [reserve-package-release, sign-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-package-release
          path: dist
      - name: Install RPM verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Verify downloaded signed artifacts
        run: scripts/verify-package-release.sh dist
      - name: Upload verified assets and keep release as draft
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.reserve-package-release.outputs.release-id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            await require('./scripts/publish-package-assets.cjs')({ github, context, releaseId });
