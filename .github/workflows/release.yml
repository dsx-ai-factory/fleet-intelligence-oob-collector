name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dsx-ai-factory/fleet-intelligence-oob-collector
  NICO_IMAGE: ghcr.io/dsx-ai-factory/nico-hardware-health
  # Pin the NICo hardware-health source used for release images.
  # Includes BMC credential-rejection suppression from
  # dsx-ai-factory/infra-controller#8323.
  NICO_SOURCE_REF: 92c64e5099c0496ae7d6e5291555d9cbebc45976
  CHART_REGISTRY: oci://ghcr.io/dsx-ai-factory/charts

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a semantic version such as v0.1.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: 1.95.0
          cache: false
      - run: cargo test --workspace --locked
      - uses: azure/setup-helm@v4
      - run: helm lint deployments/helm/fleet-intelligence-oob-collector --values deployments/helm/fleet-intelligence-oob-collector/ci/test-values.yaml

  build-image:
    needs: validate
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Publish image
    needs: [build-image, sign-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - name: Create multi-platform image
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          image_args=()
          for digest in *; do
            image_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  build-nico-image:
    needs: validate
    name: Build NICo health image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned NICo source
        uses: actions/checkout@v4
        with:
          repository: dsx-ai-factory/infra-controller
          ref: ${{ env.NICO_SOURCE_REF }}
          path: nico-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.NICO_IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./nico-source
          file: ./Dockerfile.nico-hardware-health
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.NICO_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ env.NICO_SOURCE_REF }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: nico-image-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-nico-image:
    name: Publish NICo health image
    needs: [build-nico-image, sign-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: nico-image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.NICO_IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - name: Create multi-platform image
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.NICO_IMAGE }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          image_args=()
          for digest in *; do
            image_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  publish-chart:
    name: Publish Helm chart
    needs:
      - publish-image
      - publish-nico-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        env:
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$HELM_REGISTRY_USERNAME" --password-stdin
      - name: Package and publish chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          cp LICENSE deployments/helm/fleet-intelligence-oob-collector/LICENSE
          helm package deployments/helm/fleet-intelligence-oob-collector \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist
          helm push "dist/fleet-intelligence-oob-collector-${VERSION}.tgz" "$CHART_REGISTRY"

  publish-docs:
    name: Publish Fern docs
    needs: publish-packages
    uses: ./.github/workflows/publish-fern-docs.yml
    secrets:
      DOCS_FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}

  reserve-package-release:
    name: Reserve package release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.reserve.outputs.release-id }}
    steps:
      - name: Refuse existing releases and reserve a private draft
        id: reserve
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            if (releases.some(release => release.tag_name === tag)) {
              throw new Error(`Release ${tag} already exists; refusing to replace artifacts. Resume failed jobs or use a new version.`);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: tag, draft: true, prerelease: tag.includes('-'),
              generate_release_notes: true,
            });
            core.setOutput('release-id', data.id);

  build-packages:
    name: Build and test host packages (${{ matrix.architecture }})
    needs: reserve-package-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and test release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make debian-test PACKAGE_VERSION="${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-packages-${{ matrix.architecture }}
          path: dist/debian/*.deb
          if-no-files-found: error
          retention-days: 7

  sign-packages:
    name: Sign and verify host packages
    needs: build-packages
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-packages-*
          path: dist
          merge-multiple: true
      - name: Check signing runner tools and credentials
        env:
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
        run: |
          for tool in nvsec gpg gpgv ar sha256sum md5sum sha1sum; do
            command -v "$tool" >/dev/null || { echo "Required signing tool is unavailable: $tool" >&2; exit 1; }
          done
          : "${NVSEC_SSA_CLIENT_ID:?Configure signing credentials}"
          : "${NVSEC_SSA_CLIENT_SECRET:?Configure signing credentials}"
      - name: Sign packages, refresh checksums, sign and verify manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NVSEC_SSA_CLIENT_ID: ${{ secrets.NVSEC_SSA_CLIENT_ID }}
          NVSEC_SSA_CLIENT_SECRET: ${{ secrets.NVSEC_SSA_CLIENT_SECRET }}
          NVSEC_LINUX_PACKAGE_SSA_SCOPE: ${{ vars.NVSEC_LINUX_PACKAGE_SSA_SCOPE || 'SIGNING_LINUX_PACKAGE_FLEET_INTELLIGENCE' }}
          NVSEC_LINUX_PACKAGE_JOB_TYPE: ${{ vars.NVSEC_LINUX_PACKAGE_JOB_TYPE || 'LINUX_PACKAGE_FLEET_INTELLIGENCE' }}
          NVSEC_CHECKSUM_SSA_SCOPE: ${{ vars.NVSEC_CHECKSUM_SSA_SCOPE || 'SIGNING_FLEET_INTELLIGENCE' }}
          NVSEC_CHECKSUM_JOB_TYPE: ${{ vars.NVSEC_CHECKSUM_JOB_TYPE || 'FLEET_INTELLIGENCE' }}
          NSPECT_ID: ${{ vars.NSPECT_ID }}
        run: scripts/prepare-package-release.sh dist "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-package-release
          path: |
            dist/*.deb
            dist/checksums.txt
            dist/checksums.txt.asc
            dist/fleet-intelligence.pub.asc
            dist/verify-linux-package-signature.sh
          if-no-files-found: error
          retention-days: 7

  publish-packages:
    name: Publish verified host packages
    needs: [reserve-package-release, sign-packages, publish-chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-package-release
          path: dist
      - name: Verify downloaded signed artifacts
        run: scripts/verify-package-release.sh dist
      - name: Publish the verified GitHub release
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.reserve-package-release.outputs.release-id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            await require('./scripts/publish-package-assets.cjs')({ github, context, releaseId });
            await github.rest.repos.updateRelease({ ...context.repo, release_id: releaseId, draft: false });
