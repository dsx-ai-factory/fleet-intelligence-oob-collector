name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: 1.95.0
      - run: cargo test --workspace --locked

  packaging:
    name: Validate packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deployments/helm/fleet-intelligence-oob-collector --values deployments/helm/fleet-intelligence-oob-collector/ci/test-values.yaml
      - name: Render Helm chart
        run: helm template test deployments/helm/fleet-intelligence-oob-collector --values deployments/helm/fleet-intelligence-oob-collector/ci/test-values.yaml > /dev/null
      - name: Check generated configuration snapshot
        run: |
          helm template test deployments/helm/fleet-intelligence-oob-collector \
            --values deployments/helm/fleet-intelligence-oob-collector/ci/test-values.yaml \
            --show-only templates/configmap.yaml > "$RUNNER_TEMP/fleetint-configmap.yaml"
          diff -u deployments/helm/fleet-intelligence-oob-collector/ci/expected-configmap.yaml \
            "$RUNNER_TEMP/fleetint-configmap.yaml"
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fleet-intelligence-oob-collector:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
