name: Host package
on:
  pull_request:
    paths:
      - 'deployments/packages/**'
      - 'src/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'Makefile'
      - '.dockerignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/*.sh'
      - 'scripts/*.cjs'
      - '.github/workflows/release.yml'
      - 'rust-toolchain.toml'
      - 'config.example.toml'
      - '.github/workflows/host-packages.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: host-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: make packages-test-hooks packages-test-build
      - run: make debian-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-${{ matrix.architecture }}
          path: |
            dist/debian/*
          if-no-files-found: error

  release-tests:
    name: Test package signing and release uploads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: make release-test
