name: Host package
on:
  pull_request:
    paths:
      - 'deployments/packages/**'
      - 'src/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'Makefile'
      - '.dockerignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/*.sh'
      - 'scripts/*.cjs'
      - '.github/workflows/release.yml'
      - 'rust-toolchain.toml'
      - 'config.example.toml'
      - '.github/workflows/debian.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: make packages-test-hooks packages-test-build
      - run: make debian-test
      - run: make package-snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.architecture }}
          path: |
            dist/debian/*
            dist/snapshot/*
          if-no-files-found: error
