# Publishes the Fern documentation site on GitHub Release or manual dispatch.
#
# Version content is fetched from release tags at publish time by
# scripts/docs-fetch-versions.py, which reads fern/kept-versions.json to
# determine how many major.minor version groups to keep (default: 1, bumped
# to 2 after a second minor release exists).
# Adding a new minor release (e.g. v1.1.0) automatically rotates the oldest
# version out — no manual changes to fern/docs.yml are needed.
#
# The committed fern/docs.yml uses a flat `navigation:` pointing at HEAD docs
# (for fern check and local dev). This workflow replaces that block in-runner
# with a versioned `versions:` list built from the tag manifest, then restores
# the original after publishing.
#
# Pre-release tags (e.g. v1.0.0-rc.1) are skipped by default. Before v1.0.0
# stable ships, a manual workflow_dispatch with include_rc: true will publish
# RC content labeled "1.0 (Preview)". Once a stable tag exists for the same
# major.minor group, it automatically supersedes the RC on the next publish.
#
# Required configuration:
# - Organization secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      include_rc:
        description: >
          Fall back to RC tags for version groups with no stable release yet.
        type: boolean
        default: true
    secrets:
      DOCS_FERN_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      include_rc:
        description: >
          Fall back to RC tags for version groups with no stable release yet.
          Use before v1.0.0 stable to publish preview docs. Has no effect once
          a stable tag exists for the same major.minor group.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::fern.config.json .version '$VERSION' is not a valid semver"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"

      - name: Fetch and patch versioned docs from tags
        run: |
          cp fern/docs.yml fern/docs.yml.bak
          ARGS="--patch-fern-docs"
          if [ "${{ inputs.include_rc }}" = "true" ]; then
            ARGS="$ARGS --include-rc"
          fi
          python3 scripts/docs-fetch-versions.py $ARGS

      - name: Publish docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          set -euo pipefail
          fern generate --docs 2>&1 | tee /tmp/fern-output.log
          URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
          if [ -z "$URL" ]; then
            echo "::error::Fern did not emit a published URL — verify the publish succeeded"
            exit 1
          fi
          echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore fern/docs.yml
        if: always()
        run: |
          if [ -f fern/docs.yml.bak ]; then
            mv fern/docs.yml.bak fern/docs.yml
          fi
