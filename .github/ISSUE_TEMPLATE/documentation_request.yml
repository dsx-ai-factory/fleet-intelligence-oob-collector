name: Documentation Request
description: Request new or corrected documentation
title: "[DOC]: "
labels: ["documentation"]

body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Missing documentation
        - Incorrect documentation
        - Unclear documentation
        - Example request
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Current location
      description: Link or path to the relevant documentation, if one exists.
      placeholder: "example: README.md#run-inventory-collection"

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should be added, corrected, or clarified?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include command, configuration, platform, or workflow context if relevant. Redact private data.
