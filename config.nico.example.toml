# Node group comes from each site name; compute zone from country/state/city.
# Optional fallback when a site has no usable location:
# compute_zone = "unknown-location"

[credentials]
file = "credentials.json"

[endpoint_source]
type = "nico"
# REST prefix, not the NICo Core gRPC endpoint.
api_url = "https://nico.example.com/v2"
org = "example-org"
# Mount the OAuth2 client credentials managed by your platform.
token_url = "https://idp.example.com/token"
client_id_file = "nico-oauth2/client_id"
client_secret_file = "nico-oauth2/client_secret"
# Example; use scopes configured by your identity-provider administrator.
scopes = ["nico"]
# Shared BMC credentials, not NICo REST credentials.
credentials_profile = "bmc"
timeout_seconds = 30
